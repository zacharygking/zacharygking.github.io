<!doctype html>
<!--
  Source for og.png, the 1200×630 link-preview image. Render with headless Chrome from the repo root:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og.png "file://$PWD/source/og.html"
  Keep the stats in step with the stats row in index.html.
-->
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Link preview source</title>
<style>
  html, body { margin: 0; }
  .card {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: 64px 72px 60px;
    background: #f3f4f6;
    color: #111318;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  .hero { align-self: center; }
  .eyebrow { margin: 0 0 14px; color: #555a64; font: 600 22px/1.3 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  h1 { margin: 0; font: 700 104px/1 Charter, "Bitstream Charter", Georgia, serif; letter-spacing: -0.02em; }
  .tagline { margin: 16px 0 0; font-size: 36px; line-height: 1.3; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0; border-top: 2px solid #cdd2db; }
  .stats div { display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: 4px; padding: 18px 20px 0 0; }
  .stats div + div { padding-left: 20px; border-left: 2px solid #e3e5e9; }
  .stats dd { margin: 0; font: 700 56px/1.05 Charter, Georgia, serif; }
  .stats dt { color: #555a64; font-size: 28px; line-height: 1.25; }
</style>
<div class="card">
  <div class="hero">
    <p class="eyebrow">Applied ML Engineer at Apple</p>
    <h1>Zachary King</h1>
    <p class="tagline">Building ML-powered product features</p>
  </div>
  <dl class="stats">
    <div><dt>years building ML at Apple</dt><dd>8</dd></div>
    <div><dt>locales for the Professional tone</dt><dd>20+</dd></div>
    <div><dt>platforms for keyboard vocabulary learning</dt><dd>5</dd></div>
    <div><dt>features running the handwriting models</dt><dd>4</dd></div>
  </dl>
</div>
